<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bygge-væddemål</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171c23;
    --panel2: #1f2630;
    --line: #2a323d;
    --text: #e6eaf0;
    --muted: #93a0b0;
    --accent: #4cc38a;
    --accent-dim: #2f6b4f;
    --warn: #e5a23c;
    --shots: #4c8bf5;
    --fouls: #e5733c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,18,22,0.96);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
    padding: 14px 20px;
  }
  .head-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
  input[type=search], select {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 11px; font-size: 14px; outline: none;
  }
  input[type=search] { min-width: 240px; }
  input[type=search]:focus, select:focus { border-color: var(--accent-dim); }
  .pill {
    background: var(--panel2); border: 1px solid var(--line);
    color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px;
  }
  main { padding: 18px 20px 60px; max-width: 1100px; margin: 0 auto; }
  .match {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 16px; overflow: hidden;
  }
  .match.empty { opacity: 0.5; }
  .match-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .match-head h2 { font-size: 16.5px; margin: 0; font-weight: 640; }
  .league { color: var(--muted); font-size: 12.5px; }
  .combo-count {
    margin-left: auto;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--muted);
  }
  .combo-count b { color: var(--accent); font-weight: 650; }
  .body { padding: 14px 16px; }
  .players-box { margin-bottom: 14px; }
  .players-box h3, .combos-box h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 0 0 8px; font-weight: 650;
  }
  .player-row { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .player-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 9px; border-radius: 999px; cursor: pointer; user-select: none;
    font-size: 13px; border: 1px solid var(--line); background: var(--panel2);
  }
  .player-toggle:hover { border-color: var(--accent-dim); }
  .player-toggle input { accent-color: var(--accent); width: 14px; height: 14px; }
  .player-toggle.off { color: var(--muted); text-decoration: line-through; opacity: 0.7; }
  .combos-wrap { display: flex; flex-direction: column; gap: 10px; max-height: 640px; overflow-y: auto; padding-right: 4px; }
  .combo {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel2);
    padding: 10px 12px;
  }
  .combo-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .rank { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 34px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 8px; font-size: 12px; color: var(--muted);
  }
  .stat b { color: var(--text); font-weight: 640; }
  .stat.bonus b { color: var(--accent); }
  .stat.extra b { color: var(--accent); }
  .stat.ratio b { color: var(--warn); }
  .legs { display: flex; flex-direction: column; gap: 6px; }
  .leg {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; font-size: 13.5px;
  }
  .leg .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 5px; font-weight: 650; white-space: nowrap;
  }
  .tag.shots { background: rgba(76,139,245,0.16); color: #8ab4ff; }
  .tag.fouls { background: rgba(229,115,60,0.16); color: #f0a06f; }
  .leg .pname { font-weight: 600; }
  .leg .pteam { color: var(--muted); font-size: 12px; }
  .leg .desc { color: var(--muted); font-size: 12.5px; }
  .leg .odds { margin-left: auto; font-weight: 680; font-variant-numeric: tabular-nums; }
  .more {
    margin-top: 10px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
    cursor: pointer; font-size: 13.5px;
  }
  .more:hover { border-color: var(--accent-dim); }
  .none { color: var(--warn); font-size: 13.5px; padding: 10px 0; }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>⚽ Bygge-væddemål</h1>
    <span class="meta" id="genmeta"></span>
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="Søg hold (fx Portugal)…" autocomplete="off">
    <select id="league"><option value="">Alle ligaer</option></select>
    <select id="sort">
      <option value="bonus">Sortér: bonus</option>
      <option value="extra_probability">Sortér: ekstra chance</option>
      <option value="ratio_bonus">Sortér: ratio-bonus</option>
      <option value="parlay">Sortér: parlay-odds</option>
      <option value="ratio">Sortér: ratio</option>
      <option value="product">Sortér: produkt</option>
      <option value="name">Sortér: kampnavn</option>
    </select>
    <span class="pill" id="count"></span>
  </div>
</header>
<main id="app"></main>

"team": "USA", "type": "fouls", "line": 0.5, "side": "over", "odds": 1.43}]}, {"product": 5.9845, "parlay_odds": 7.0, "bonus": 1.17, "ratio_product": 1.0191, "ratio_bonus": 1.192, "extra_probability": 0.024241, "legs": [{"player": "Alajbegovic", "team": "Bosnien", "type": "shots", "line": 0.5, "side": "over", "odds": 2.02}, {"player": "Balogun", "team": "USA", "type": "shots", "line": 0.5, "side": "over", "odds": 1.25}, {"player": "Dzeko", "team": "Bosnien", "type": "shots", "line": 0.5, "side": "over", "odds": 1.73}, {"player": "Alajbegovic", "team": "Bosnien", "type": "fouls", "line": 0.5, "side": "over", "odds": 1.37}]}, {"product": 11.2509, "parlay_odds": 13.0, "bonus": 1.155, "ratio_product": 1.0065, "ratio_bonus": 1.163, "extra_probability": 0.011959, "legs": [{"player": "Alajbegovic", "team": "Bosnien", "type": "shots", "line": 0.5, "side": "over", "odds": 2.02}, {"player": "Dest", "team": "USA", "type": "shots", "line": 0.5, "side": "over", "odds": 2.35}, {"player": "Dzeko", "team": "Bosnien", "type": "shots", "line": 0.5, "side": "over", "odds": 1.73}, {"player": "Alajbegovic", "team": "Bosnien", "type": "fouls", "line": 0.5, "side": "over", "odds": 1.37}]}, {"product": 12.1613, "parlay_odds": 14.0, "bonus": 1.151, "ratio_product": 1.0631, "ratio_bonus": 1.224, "extra_probability": 0.010799, "legs": [{"player": "Alajbegovic", "team": "Bosnien", "type": "shots", "line": 0.5, "side": "over", "odds": 2.02}, {"player": "Dest", "team": "USA", "type": "shots", "line": 0.5, "side": "over", "odds": 2.35}, {"player": "Tillman", "team": "USA", "type": "shots", "line": 0.5, "side": "over", "odds": 1.87}, {"player": "Alajbegovic", "team": "Bosnien", "type": "fouls", "line": 0.5, "side": "over", "odds": 1.37}]}]}]};
const PAGE = 40; // combos vist ad gangen pr. kamp

const TYPE_LABEL = { shots: "Skud på mål", fouls: "Frispark" };
const SIDE_LABEL = { over: "Over", under: "Under" };

// Sorterings-metrikker. dir: -1 = størst først (mest værdi), 1 = mindst først.
const SORTS = {
  bonus:             { get: c => c.bonus,             dir: -1 },
  extra_probability: { get: c => c.extra_probability, dir: -1 },
  ratio_bonus:       { get: c => c.ratio_bonus,       dir: -1 },
  parlay:            { get: c => c.parlay_odds,       dir: -1 },
  ratio:             { get: c => c.ratio_product,     dir: -1 },
  product:           { get: c => c.product,           dir:  1 },
};
function currentSort() { return document.getElementById("sort").value; }
function comboSorter(key) {
  const s = SORTS[key] || SORTS.bonus; // 'name' sorterer combos efter bonus
  return (a, b) => s.dir * ((s.get(a) || 0) - (s.get(b) || 0));
}

// Pr. kamp: fravalgte spillere + hvor mange combos der pt. er udfoldet.
const state = DATA.matches.map(() => ({ off: new Set(), shown: PAGE }));

function fmt(n) {
  return (typeof n === "number") ? n.toLocaleString("da-DK", { maximumFractionDigits: 2 }) : n;
}

// Ekstra chance er en lille sandsynlighed (fx 0.023) → vis som procent.
function fmtPct(n) {
  return (typeof n === "number")
    ? (n * 100).toLocaleString("da-DK", { maximumFractionDigits: 2 }) + "%"
    : n;
}

function filteredCombos(idx) {
  const off = state[idx].off;
  if (off.size === 0) return DATA.matches[idx].combos;
  return DATA.matches[idx].combos.filter(c => c.legs.every(l => !off.has(l.player)));
}

function legHtml(leg) {
  const t = TYPE_LABEL[leg.type] || leg.type;
  const side = SIDE_LABEL[leg.side] || leg.side;
  const team = leg.team ? `<span class="pteam">· ${leg.team}</span>` : "";
  return `<div class="leg">
    <span class="tag ${leg.type}">${t}</span>
    <span><span class="pname">${leg.player}</span> ${team}</span>
    <span class="desc">${side} ${fmt(leg.line)}</span>
    <span class="odds">@ ${fmt(leg.odds)}</span>
  </div>`;
}

function comboHtml(combo, rank) {
  return `<div class="combo">
    <div class="combo-head">
      <span class="rank">#${rank}</span>
      <span class="stat bonus">bonus <b>×${fmt(combo.bonus)}</b></span>
      <span class="stat extra">ekstra chance <b>${fmtPct(combo.extra_probability)}</b></span>
      <span class="stat ratio">ratio-bonus <b>${fmt(combo.ratio_bonus)}</b></span>
      <span class="stat">parlay <b>${fmt(combo.parlay_odds)}</b></span>
      <span class="stat">produkt <b>${fmt(combo.product)}</b></span>
      <span class="stat ratio">ratio <b>${fmt(combo.ratio_product)}</b></span>
    </div>
    <div class="legs">${combo.legs.map(legHtml).join("")}</div>
  </div>`;
}

function renderCombos(idx) {
  const card = document.querySelector(`.match[data-idx="${idx}"]`);
  if (!card) return;
  const key = currentSort();
  // Kopiér før sortering, så vi ikke muterer den indlejrede combo-liste.
  const list = filteredCombos(idx).slice().sort(comboSorter(key));
  const shown = Math.min(state[idx].shown, list.length);

  const countEl = card.querySelector(".combo-count");
  const wrap = card.querySelector(".combos-wrap");
  const more = card.querySelector(".more");
  const total = DATA.matches[idx].combos.length;

  countEl.innerHTML = `<b>${list.length}</b> / ${total} combos`;
  // Kampens sorteringsværdi = den bedste tilbageværende combo på den valgte metrik.
  card.dataset.has = list.length ? "1" : "0";
  card.dataset.sortval = list.length ? ((SORTS[key] || SORTS.bonus).get(list[0]) || 0) : 0;

  if (list.length === 0) {
    card.classList.add("empty");
    wrap.innerHTML = `<div class="none">⚠️ Ingen combos tilbage med de valgte spillere.</div>`;
    more.style.display = "none";
    return;
  }
  card.classList.remove("empty");
  wrap.innerHTML = list.slice(0, shown).map((c, i) => comboHtml(c, i + 1)).join("");

  if (list.length > shown) {
    more.style.display = "";
    more.textContent = `Vis flere (${list.length - shown} tilbage)`;
  } else {
    more.style.display = "none";
  }
}

function matchCard(match, idx) {
  const players = match.players.map(p =>
    `<label class="player-toggle" data-player="${p}">
       <input type="checkbox" checked data-idx="${idx}" data-player="${p}">
       <span>${p}</span>
     </label>`).join("");

  return `<section class="match" data-idx="${idx}"
            data-label="${(match.match || "").toLowerCase()}"
            data-league="${match.league || ""}">
    <div class="match-head">
      <h2>${match.match}</h2>
      <span class="league">${match.league || ""}</span>
      <span class="combo-count"></span>
    </div>
    <div class="body">
      <div class="players-box">
        <h3>Spillere · fravælg for at filtrere combos</h3>
        <div class="player-row">${players}</div>
      </div>
      <div class="combos-box">
        <h3>Combos</h3>
        <div class="combos-wrap"></div>
        <button class="more" data-idx="${idx}" style="display:none">Vis flere</button>
      </div>
    </div>
  </section>`;
}

function render() {
  document.getElementById("genmeta").textContent =
    `${DATA.matches.length} kampe · genereret ${DATA.generated_at}`;

  const leagues = [...new Set(DATA.matches.map(m => m.league).filter(Boolean))];
  const lsel = document.getElementById("league");
  leagues.forEach(l => {
    const o = document.createElement("option");
    o.value = l; o.textContent = l; lsel.appendChild(o);
  });

  const app = document.getElementById("app");
  app.innerHTML =
    DATA.matches.map((m, i) => matchCard(m, i)).join("") ||
    `<div class="empty-state">Ingen kampe med bygge-væddemål.</div>`;

  DATA.matches.forEach((_, i) => renderCombos(i));

  // Fravalg af spillere → genfiltrér combo-listen for den kamp.
  app.addEventListener("change", e => {
    const cb = e.target.closest("input[type=checkbox]");
    if (!cb) return;
    const idx = +cb.dataset.idx;
    const player = cb.dataset.player;
    const lbl = cb.closest(".player-toggle");
    if (cb.checked) { state[idx].off.delete(player); lbl.classList.remove("off"); }
    else { state[idx].off.add(player); lbl.classList.add("off"); }
    state[idx].shown = PAGE; // nulstil paginering ved ny filtrering
    renderCombos(idx);
  });

  // "Vis flere" pr. kamp
  app.addEventListener("click", e => {
    const btn = e.target.closest(".more");
    if (!btn) return;
    const idx = +btn.dataset.idx;
    state[idx].shown += PAGE;
    renderCombos(idx);
  });

  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("league").addEventListener("change", applyFilters);
  // Skift af sortering omsorterer combos i hver kamp (og dermed kampene).
  document.getElementById("sort").addEventListener("change", () => {
    DATA.matches.forEach((_, i) => { state[i].shown = PAGE; renderCombos(i); });
    applyFilters();
  });
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const league = document.getElementById("league").value;
  const sortBy = document.getElementById("sort").value;
  const app = document.getElementById("app");
  const cards = [...app.querySelectorAll(".match")];

  let visible = 0;
  cards.forEach(c => {
    const okText = !q || c.dataset.label.includes(q);
    const okLeague = !league || c.dataset.league === league;
    const show = okText && okLeague;
    c.style.display = show ? "" : "none";
    if (show) visible++;
  });

  // Sortér kampe efter samme metrik (bedste tilbageværende combo pr. kamp).
  // Kampe uden combos efter fravalg ryger nederst.
  const sorted = cards.slice().sort((a, b) => {
    if (sortBy === "name") return a.dataset.label.localeCompare(b.dataset.label);
    const ea = a.dataset.has === "1", eb = b.dataset.has === "1";
    if (ea !== eb) return ea ? -1 : 1;
    if (!ea) return 0;
    const dir = (SORTS[sortBy] || SORTS.bonus).dir;
    return dir * ((+a.dataset.sortval) - (+b.dataset.sortval));
  });
  sorted.forEach(c => app.appendChild(c));

  document.getElementById("count").textContent = `${visible} kampe vist`;
}

render();
</script>
</body>
</html>
